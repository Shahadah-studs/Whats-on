<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004e7c" />
    <title>What'sOn — P2P Ocean Messenger</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="modal-backdrop hidden">
      <div class="call-modal">
        <div class="ring-icon">📞</div>
        <h3>Incoming Call</h3>
        <p id="caller-name-label">Someone is calling you...</p>

        <div class="precall-toggles">
          <label class="toggle-chip">
            <input type="checkbox" id="answer-cam-toggle" checked />
            <span>📷 Camera ON</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="answer-mic-toggle" checked />
            <span>🎤 Mic ON</span>
          </label>
        </div>

        <div class="modal-actions">
          <button id="accept-call-btn" class="accept-btn">Accept</button>
          <button id="decline-call-btn" class="decline-btn">Decline</button>
        </div>
      </div>
    </div>

    <div id="app-shell" class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar">
        <header class="brand-header">
          <div class="brand-left">
            <div class="logo-dot"></div>
            <h1>What'sOn</h1>
          </div>
          <div class="brand-right">
            <a href="./backup.html" target="_blank" class="about-link" title="WaveVault, Restore your What'sOn Data"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings preview-icon"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></a>
            <a href="./about.html" target="_blank" class="about-link" title="About What'sOn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></a>
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle Dark Mode">🌙</button>
            <button id="sound-toggle-btn" class="icon-btn" title="Toggle Notification Sound">🔔</button>
          </div>
        </header>

        <!-- Custom Username Card -->
        <div class="connection-card">
          <label for="username-input">Your Username (ID)</label>
          <div class="id-row">
            <input type="text" id="username-input" placeholder="Choose username..." />
            <button id="save-user-btn" class="primary-btn">Claim</button>
          </div>
          <div class="id-actions">
            <small id="my-status-badge" class="badge offline">Offline</small>
            <button id="copy-btn" class="link-btn">Copy ID</button>
          </div>
        </div>

        <!-- Start New 1-on-1 DM -->
        <div class="connection-card">
          <label for="peer-id-input">New Direct Message</label>
          <div class="id-row">
            <input type="text" id="peer-id-input" placeholder="Friend's username..." />
            <button id="connect-btn" class="primary-btn">Chat</button>
          </div>
        </div>

        <!-- Wavers Multi-User Group Rooms -->
        <div class="connection-card waver-card">
          <label for="waver-room-input">🌊 Wavers (Group Rooms)</label>
          <div class="id-row">
            <input type="text" id="waver-room-input" placeholder="Room name (e.g. reef)..." />
          </div>
          <div class="waver-btn-row">
            <button id="host-waver-btn" class="primary-btn">+ Host Room</button>
            <button id="join-waver-btn" class="secondary-btn">Join Room</button>
          </div>
        </div>

        <!-- Saved Long-Term DMs -->
        <div class="contacts-section">
          <label>Saved DMs</label>
          <ul id="contact-list" class="contact-list"></ul>
        </div>
      </aside>

      <!-- Main Chat Window -->
      <main class="chat-area">
        <header class="chat-header">
          <div class="peer-info">
            <button id="mobile-back-btn" class="mobile-back-btn" title="Back to Chats">←</button>
            <span id="chat-avatar" class="avatar">🌊</span>
            <div class="peer-title-wrap">
              <h2 id="active-peer-name">No Active Chat</h2>
              <small id="active-peer-status">Select a DM or join a Waver</small>
            </div>
          </div>
          <div class="call-actions">
            <button id="copy-room-btn" class="icon-btn hidden" title="Copy Room Code">📋 Copy Code</button>
            <button id="leave-waver-btn" class="danger-btn hidden" title="Leave Waver">Leave</button>
            <button id="reconnect-btn" class="icon-btn hidden">🔄</button>
            <label id="cam-toggle-wrap" class="header-toggle" title="Start call with Camera">
              <input type="checkbox" id="start-cam-toggle" checked />
              <span>📷</span>
            </label>
            <label id="mic-toggle-wrap" class="header-toggle" title="Start call with Mic">
              <input type="checkbox" id="start-mic-toggle" checked />
              <span>🎤</span>
            </label>
            <button id="video-call-btn" class="icon-btn" disabled>📹 Call</button>
            <button id="delete-dm-btn" class="danger-btn hidden" title="Delete this DM history">🗑️ Delete</button>
          </div>
        </header>

        <!-- Video Overlay -->
        <div id="video-grid" class="video-grid hidden">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-video" autoplay muted playsinline></video>

          <div class="in-call-controls">
            <button id="toggle-mic-live-btn" class="control-btn">🎤 Mic On</button>
            <button id="toggle-cam-live-btn" class="control-btn">📷 Cam On</button>
            <button id="end-call-btn" class="end-call-btn">End Call</button>
          </div>
        </div>

        <!-- Messages -->
        <div id="messages" class="messages-container">
          <div class="welcome-note">
            Claim a permanent <strong>Username</strong> on the left to start a 1-on-1 DM or host a <strong>Waver</strong> group chat!
          </div>
        </div>

        <!-- Input Bar -->
        <form id="chat-form" class="input-bar">
          <input type="file" id="file-input" class="hidden" />
          <button type="button" id="attach-btn" class="icon-btn" title="Send Image or File" disabled>📎</button>
          <input
            type="text"
            id="message-input"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
          />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </main>
    </div>

    <script>
      (function () {
        var THEME_KEY = "whatson_index_theme";
        var btn = document.getElementById("theme-toggle-btn");

        function applyTheme(theme) {
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            if (btn) btn.textContent = "☀️";
          } else {
            document.documentElement.removeAttribute("data-theme");
            if (btn) btn.textContent = "🌙";
          }
        }

        applyTheme(localStorage.getItem(THEME_KEY) || "light");

        if (btn) {
          btn.addEventListener("click", function () {
            var isDark = document.documentElement.getAttribute("data-theme") === "dark";
            var next = isDark ? "light" : "dark";
            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
          });
        }

        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
          });
        }
      })();
    </script>
       <script>
      (function () {
        var msgInput = document.getElementById("message-input");
        var attachBtn = document.getElementById("attach-btn");
        if (!msgInput || !attachBtn) return;

        var observer = new MutationObserver(function () {
          var isWaver = !document.getElementById("leave-waver-btn").classList.contains("hidden");
          attachBtn.disabled = msgInput.disabled || isWaver;
        });

        observer.observe(msgInput, { attributes: true, attributeFilter: ["disabled"] });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
    <!-- Streamline Side Banner Popup Ad -->
    <aside id="bwc-side-ad" class="side-ad-banner" aria-label="Featured Partner">
      <button id="close-side-ad-btn" class="side-ad-close" type="button" title="Close ad">✕</button>
      <a
        href="https://bit.ly/4jczUYd"
        target="_blank"
        rel="noopener noreferrer"
        class="side-ad-link"
      >
        <img src="./ads/fanlolo.png" alt="BloxdWorldCode Logo" class="side-ad-icon" />
        <div class="side-ad-text">
          <span class="side-ad-tag">FEATURED</span>
          <strong>Join BloxdWorldCode</strong>
          <small>World codes, commands & tools →</small>
        </div>
      </a>
    </aside>

    <script>
      (function () {
        var adBanner = document.getElementById("bwc-side-ad");
        var closeBtn = document.getElementById("close-side-ad-btn");
        if (adBanner && closeBtn) {
          closeBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            adBanner.classList.add("hidden");
          });
        }
      })();
    </script>

  </body>
</html>
